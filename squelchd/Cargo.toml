[package]
name = "squelchd"
version.workspace = true
edition.workspace = true
license.workspace = true

# Top-level daemon/CLI. It sits ABOVE the libraries so it can host BOTH doors in
# one process: it depends on squelch-core (sync/auth/store/config),
# squelch-mcp (agent door / MCP HTTP service), and squelch-api (human door
# router). Those crates must NOT depend on squelchd (no cycle).
[[bin]]
name = "squelchd"
path = "src/bin/squelchd.rs"

[dependencies]
squelch-core = { path = "../squelch-core" }
squelch-mcp = { path = "../squelch-mcp" }
squelch-api = { path = "../squelch-api" }
tokio = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
# Timestamps in `token list` and the pairing TTL `token`/`pair` hand the store,
# which speaks chrono. No formatting layer of its own, so this is the type.
chrono = { workspace = true }
axum = { version = "0.8" }
tokio-util = "0.7"
dotenvy = "0.15"
# One use: turning terminal echo off while a credential blob is pasted at the
# `auth --import` prompt. The raw termios calls rather than a password-prompt
# crate, because the prompt itself is three lines and already written.
libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
