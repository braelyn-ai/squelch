# Every version tag (v*) builds the squelchd image for amd64 + arm64 and
# pushes it to GHCR, so self-hosting is `docker compose up` + env vars — no
# Rust toolchain on the box. The Dockerfile cross-compiles the non-native arch
# (see squelchd/Dockerfile), so one amd64 runner covers both without QEMU.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  squelchd-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v0.2.0 => 0.2.0, 0.2, latest; a non-semver tag falls back to its
      # literal name via type=ref.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/squelchd
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: squelchd/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
