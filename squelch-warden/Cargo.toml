[package]
name = "squelch-warden"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "squelch_warden"
path = "src/lib.rs"

[[bin]]
name = "squelch-warden"
path = "src/bin/squelch-warden.rs"

[dependencies]
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
# Full-feature axum on the same 0.8 line the rest of the workspace pins.
axum = { version = "0.8" }
# Constant-time bearer compare + `Authorization` parse, shared byte-for-byte
# with the two doors and the relay so a fix to any of them lands in one place.
squelch-httpauth = { path = "../squelch-httpauth" }
# The cluster is the state store. Everything the warden creates is a TYPED
# k8s-openapi object handed to kube-rs; nothing in this crate renders YAML.
kube = { workspace = true }
k8s-openapi = { workspace = true }
# The warden mints one age identity per tenant, in memory, and writes it
# straight into that tenant's Secret. This is the ONLY reason it links age: it
# still cannot decrypt anything, because it keeps no identity after the apply.
age = { workspace = true }
# SHA-256 of the credential ciphertext, so a re-consent changes the pod
# template and the init container reinstalls it. No other cryptography here:
# the sealing is the control plane's and the opening is the tenant's.
sha2 = "0.10"
# ONE timestamp type, shared with the control plane that reads it: the
# activation route parses what `squelchd token first-paired` printed and hands
# it straight back on the wire, and a hand-rolled RFC3339 parser here would be a
# second opinion about what a valid instant is.
chrono = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Deliberately NOT a dependency: squelch-core. The warden renders manifests and
# execs a pairing command; it never opens a mailbox store, never parses a token,
# and never decrypts. Linking the core would pull rusqlite, keyring, an ONNX
# runtime and an embedding model onto the provisioner for no reason, and would
# put mail code in a process that has no business with it.

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
