# Railway deployment config for the monitoring Prometheus
# (Dockerfile.prometheus). Selected in the service's settings under
# "Config-as-code file path" — the setting, not RAILWAY_DOCKERFILE_PATH,
# because the root railway.toml outranks the variable (deploy/DEPLOY.md §8).
# No healthcheckPath: Prometheus sits entirely behind basic auth and Railway's
# checker cannot send credentials.
#
# DEPLOY QUIRK (same as railway.bifrost.toml): `railway up` from the repo root
# is accepted and then silently SKIPPED — the deployment lands in the list as
# SKIPPED, no build runs, and the previous image keeps serving, so a config
# change looks deployed and is not. Deploy from a staging dir holding only this
# file, its Dockerfile, and the configs the Dockerfile COPYs:
#   SC=$(mktemp -d); mkdir -p $SC/deploy/monitoring/prometheus
#   cp Dockerfile.prometheus railway.prometheus.toml $SC/
#   cp deploy/monitoring/prometheus/* $SC/deploy/monitoring/prometheus/
#   (cd $SC && railway link --project <id> --environment production \
#        --service prometheus && railway up -s prometheus --detach)
# Verify what actually shipped rather than trusting the status:
#   railway ssh --service prometheus -- cat /etc/prometheus/prometheus.yml
[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.prometheus"

[deploy]
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
