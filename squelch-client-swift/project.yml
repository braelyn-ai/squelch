name: Squelch
options:
  bundleIdPrefix: dev.squelch
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    # Release signs with the Developer ID under the hardened runtime, matching
    # what build.sh does when HARDENED=1. Debug stays ad-hoc and unhardened so
    # a debugger can still attach. build.sh takes SIGN_ID to override.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_IDENTITY[config=Release]: "Developer ID Application"
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_HARDENED_RUNTIME[config=Release]: YES
    DEAD_CODE_STRIPPING: YES
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GCC_OPTIMIZATION_LEVEL: 0

targets:
  Squelch:
    type: application
    platform: macOS
    sources:
      - path: Sources/Squelch
        excludes:
          - "Resources/**"
      - path: Sources/Squelch/Resources
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.squelch.client
        PRODUCT_NAME: Squelch
        INFOPLIST_FILE: Sources/Squelch/Info.plist
        # Mirror of ./VERSION, which build.sh reads as the source of truth.
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_ENTITLEMENTS: Sources/Squelch/Squelch.entitlements
    dependencies:
      - sdk: WebKit.framework
      - sdk: Security.framework

schemes:
  Squelch:
    build:
      targets:
        Squelch: all
    run:
      config: Debug
    archive:
      config: Release
