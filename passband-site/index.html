<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Passband</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="/icon.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/icon-dark.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link
      rel="preload"
      href="/newsreader-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      body {
        margin: 0;
        background: #0f0f10;
      }
      /* Newsreader, subset from the same variable TTF the Swift client
         bundles, so the wordmark is the same letterforms in the app and on
         the web. Declared here rather than in the bundle so the preload above
         can start the download before React has even parsed. */
      @font-face {
        font-family: "Newsreader";
        src: url("/newsreader-var.woff2") format("woff2");
        font-weight: 200 800;
        font-style: normal;
        font-display: swap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
