[package]
name = "squelch-desktop"
version = "0.1.0"
description = "squelch desktop client"
authors = ["braelyn"]
edition = "2021"

# NOTE: intentionally NOT a member of the root workspace (see root Cargo.toml
# `exclude`). This crate has its own lockfile and pins its own deps.

[lib]
name = "squelch_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is what allows a TRANSPARENT window on macOS, which is the
# prerequisite for the native backdrop (see `apply_native_backdrop` in lib.rs) —
# without it AppKit paints an opaque window background over the vibrancy layer.
# NOTE: apps using this feature are not eligible for the Mac App Store.
tauri = { version = "2", features = ["macos-private-api"] }
# Opens external https URLs in the system browser (Sitrep "Track" buttons +
# email link list). Version-matched to the JS @tauri-apps/plugin-opener.
tauri-plugin-opener = "2"
# Attachment download: native save dialog (pick a path) + filesystem write to
# the CHOSEN path only. Scoped tightly in capabilities/default.json — no broad
# fs read/write. Version-matched to @tauri-apps/plugin-dialog / -fs.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Secure OS-keyring storage for the server URL + API token. Version-matched to
# the workspace's keyring pin (v4); v4 has no feature flags — the platform
# credential stores (apple/windows/secret-service) are pulled in by default.
keyring = "4"
# BYOK assistant proxy: the ONLY outbound HTTP this shell makes. `llm_complete`
# reads the assistant key from the keyring and POSTs to Anthropic/OpenAI so the
# key never enters JS and webview CORS is bypassed. rustls (no OpenSSL) to match
# the workspace pin; `json` for (de)serializing the message body.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Native macOS window backdrop: NSGlassEffectView (the real Liquid Glass
# material, macOS 26+) with an NSVisualEffectView fallback. 0.8 is the first
# release carrying the Tahoe glass API. See `apply_native_backdrop` in lib.rs.
window-vibrancy = "0.8.0"

[features]
# Kept for parity with the tauri template; no custom protocol features used.
custom-protocol = ["tauri/custom-protocol"]
