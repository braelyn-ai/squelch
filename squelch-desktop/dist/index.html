<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- img-src must permit http:/https: — email frames are srcdoc iframes and
         INHERIT this document's CSP, so remote images in mail only load if the
         parent allows them (the frame's own CSP is the per-message gate).
         blob: on img-src/frame-src/object-src is for ATTACHMENTS ONLY: bytes are
         fetched over the authenticated door into a Blob objectURL — <img> for
         thumbnails, <embed> for the PDF preview. (No blob: script/worker.)
         Keep in lockstep with app.security.csp in src-tauri/tauri.conf.json. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; frame-src blob:; object-src blob:; connect-src 'self' http://127.0.0.1:* http://localhost:* https://*.ts.net https://*" />
    <title>squelch</title>
    <!-- Apply the persisted theme before first paint so there's no flash.
         Light is the default; "dark" is opt-in via the header toggle. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("squelch-theme");
          document.documentElement.setAttribute(
            "data-theme",
            t === "dark" ? "dark" : "light",
          );
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-D12Gg6bZ.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BBe9tWSE.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
