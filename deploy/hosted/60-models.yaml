# The shared embedding-weights volume. Fill it once; every tenant after that
# starts with the weights already on its own volume: see "10. Embedding weights"
# in SETUP.md for the seeding procedure.
#
# ORDER: this file, then the seed, then `SQUELCH_WARDEN_MODEL_PVC` uncommented in
# `15-warden-config.yaml` and a warden restart. The knob names a claim and
# nothing verifies it exists, so turning it on ahead of this file leaves every
# new tenant pod Pending forever.
#
# Without this, every tenant downloads about 126 MB from Hugging Face the first
# time it embeds anything. That is not fatal, but it is the same bytes over and
# over, it happens inside the signup a person is watching, and it is slow enough
# that the 30-day initial backfill outruns the embedder: the mailbox ingests
# thousands of rows with no vectors and search is keyword-only until the
# vector backfill catches up.
#
# ReadWriteOnce, mounted read-only by every tenant's init container. That works
# because this is a single-node cluster: RWO is one NODE, not one pod. On a
# second node it stops working, and the fix then is baking the weights into a
# squelchd image instead (also in SETUP.md).
#
# It lands in the `tenants` namespace and so it spends that namespace's quota
# (`70-tenant-limits.yaml`): one of the 25 PVC slots permanently, and one of the
# 25 pod slots for as long as the seed pod is up. Delete the seed pod when the
# copy is done and the pod slot comes back; the claim is meant to stay.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: squelch-models
  namespace: tenants
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
# A pod that does nothing but hold the volume open so a copy has somewhere to
# land. Delete it when the copy is done; nothing references it afterwards.
apiVersion: v1
kind: Pod
metadata:
  name: squelch-models-seed
  namespace: tenants
  labels:
    app.kubernetes.io/name: squelch-models-seed
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    # The same uid/gid a tenant daemon runs as, so the weights land owned by the
    # id that reads them: seed as any other id and every tenant's init container
    # is reading files it does not own.
    #
    # `fsGroup` is NOT what makes the volume writable here. The kubelet does not
    # manage ownership on host-path-backed volumes, which is what `local-path`
    # hands out, so the group has no effect on the mounted directory and what
    # actually lets uid 10001 write is the 0777 local-path creates it with. When
    # that is wrong the extract fails `Permission denied` and the fix is a
    # `chown` on the node, per SETUP.md step 10. The setting stays because it
    # costs nothing and is correct on any storage class that does honour it.
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: seed
      # KEEP THIS ON THE WARDEN'S TAG (SQUELCH_WARDEN_IMAGE in
      # 15-warden-config.yaml). Any image with a shell and tar would do, but the
      # squelchd image is the one already pulled on this node, so naming the
      # fleet's tag is a copy that starts immediately instead of a pull.
      image: ghcr.io/braelyn-ai/squelchd:daemon-0.0.4
      command: ["/bin/sh", "-c", "sleep 3600"]
      # /seed is the only writable path in this pod, and it is all it needs:
      # the container sleeps, and `tar -x` streams into the volume without a
      # temporary file anywhere. So no /tmp emptyDir, and the root filesystem
      # stays read-only.
      volumeMounts:
        - name: models
          mountPath: /seed
      # Explicit, because a container with no bounds takes the LimitRange's
      # defaults from `70-tenant-limits.yaml`, and those are one TENANT's worth
      # of a 2-vCPU box: whatever a daemon is promised for its ONNX session,
      # reserved out of the namespace quota by a pod whose whole job is to sleep
      # while tar writes to a volume. Above the LimitRange's floor (10m / 16Mi)
      # and well under its ceiling.
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
          ephemeral-storage: 32Mi
        limits:
          cpu: 500m
          memory: 128Mi
          ephemeral-storage: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop: ["ALL"]
  volumes:
    - name: models
      persistentVolumeClaim:
        claimName: squelch-models
