# INSTALL AS /etc/systemd/journald.conf.d/squelch.conf
#
#   install -d -m 0755 /etc/systemd/journald.conf.d
#   install -m 0644 deploy/hosted/node/journald-squelch.conf \
#     /etc/systemd/journald.conf.d/squelch.conf
#   systemctl restart systemd-journald
#   journalctl --disk-usage
#
# A drop-in, not an edit to /etc/systemd/journald.conf: the main file is the
# distribution's and a release upgrade may replace it. This one is ours.
#
# Uncapped, the journal grows to 10% of the filesystem and keeps it. On carrier
# that was 725 MB on disk and 129 MB of journald RSS on 2026-08-26, and the RSS
# is the reason this is a memory measure and not a disk measure: journald mmaps
# the journal files it is serving, so its resident size tracks the size of what
# it is holding. Cap the archive and the process shrinks with it.
#
# 200 MB is roughly two weeks of this box: a handful of tenant pods, the k3s
# server, and the kernel. It is enough to read back the 19 Aug OOM kills, which
# is the length of history this box has ever actually needed. If you are
# debugging something that wants more, raise it for the week and put it back.
#
# Restarting journald does not lose the journal and does not restart anything
# else on the box. Vacuuming happens on rotation, so the existing 725 MB does
# not fall to 200 MB the moment you restart. Force it once:
#
#   journalctl --vacuum-size=200M
#
# See SETUP.md §2b.

[Journal]
# On-disk journal, /var/log/journal. Total across all rotated files.
SystemMaxUse=200M

# The volatile journal in /run (tmpfs, i.e. RAM) for the window before
# /var/log/journal is writable. Small on purpose: this one is memory, directly.
RuntimeMaxUse=100M

# Per-file cap and rotation are left alone deliberately: systemd derives
# SystemMaxFileSize from SystemMaxUse (an eighth of it), so capping the total
# already caps the file. Only SystemMaxUse itself is derived from the size of
# the filesystem, which is the derivation that produced 725 MB.
