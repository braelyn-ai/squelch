# INSTALL AS /etc/systemd/zram-generator.conf
#
#   apt-get install -y systemd-zram-generator
#   install -m 0644 deploy/hosted/node/zram-generator.conf \
#     /etc/systemd/zram-generator.conf
#   systemctl daemon-reload      # runs the generator, writes the device units
#   systemctl start /dev/zram0   # equivalently: systemctl start dev-zram0.swap
#   swapon --show && zramctl
#
# START THE SWAP UNIT, NOT THE SETUP SERVICE. systemd-zram-setup@zram0.service
# is a Type=oneshot that creates the device and mkswaps it; the swapon lives in
# the generated dev-zram0.swap unit, which Requires= and After=s the setup
# service and orders itself Before=swap.target. Requires points DOWNWARD, so
# starting the setup service pulls in nothing above it and leaves a formatted
# device that is not swap. `systemctl start /dev/zram0` pulls the setup service
# in as its dependency and then swaps it on. That is what the upstream README
# says to run, and `swapon --show` is how you tell the two outcomes apart: on
# the wrong one it prints nothing while zramctl still shows the device.
#
# Reboots need none of this. The generator runs early in boot, writes the same
# units, and swap.target starts them. The manual step exists only so you do not
# have to reboot the box to find out whether it worked.
#
# A compressed swap device in RAM, because this box has no disk worth swapping
# to: the root disk is billed by the gigabyte and the tenant volume is mail. A
# page pushed to zram costs a zstd round trip (microseconds) instead of a
# device queue (milliseconds), and it costs no I/O anyone bills for.
#
# ZRAM IS NOT EXTRA MEMORY. It is a discount on the memory already here, and
# the discount is the compression ratio. A page that goes to zram leaves the
# process's RSS and comes back, compressed, as kernel memory: 300 MB of cold
# Rust heap at 3x becomes 100 MB, a net 200 MB returned. The same 300 MB of
# fp32 ONNX tensors compresses at about 1x, returns nothing, and adds a page
# fault. Both happen in a tenant daemon. Size and expectations accordingly.
#
# Nothing is consumed until something swaps, so 2 GB here is a ceiling on the
# discount rather than an allocation. That is why it is safe to write a number
# larger than the RAM you could spare.
#
# THIS IS A NET, NOT A FIX. It converts the 19 Aug kills into an afternoon of a
# slow tenant. A daemon that grows without bound still dies, later, with page
# faults in the middle. See SETUP.md §2b, and do not let this be the reason the
# daemon-side work does not ship.

[zram0]
# MiB. Roughly twice the cold heap an idle four-tenant fleet is holding (four
# daemons at 250-300 MB each), because the ceiling wants headroom over the
# pressure it absorbs and costs nothing until something swaps.
zram-size = 2048

# zstd over lz4: this device exists to trade CPU for RAM, and the CPU here is
# idle between syncs. lzo-rle (the kernel default) is faster and buys perhaps
# a third less.
compression-algorithm = zstd

# Higher than any disk swap that might be added later, so the kernel reaches
# for RAM before it reaches for a device.
swap-priority = 100
