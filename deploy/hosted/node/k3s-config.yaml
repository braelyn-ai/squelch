# INSTALL AS /etc/rancher/k3s/config.yaml
#
# The whole file, not a fragment: this is what the box ends up with after
# SETUP.md's "Tenant data on a block volume" and §2b. k3s reads server flags
# from here durably, which is the point of the file: it survives upgrades and
# re-runs of the install script, both of which rewrite the systemd unit.
#
#   install -d -m 0755 /etc/rancher/k3s
#   install -m 0644 deploy/hosted/node/k3s-config.yaml /etc/rancher/k3s/config.yaml
#   systemctl restart k3s
#
# EDIT ME: the storage path below is the block-volume mount. If you never
# repointed local-path, delete the line rather than guessing at it.

# Where the local-path provisioner carves tenant PVCs. See SETUP.md, "Tenant
# data on a block volume". Only affects NEW claims.
default-local-storage-path: /mnt/tenant-data

# THE MEMORY RESERVATION IS NOT HERE, AND THAT IS DELIBERATE.
#
# systemReserved, evictionHard and the swap settings live in a kubelet drop-in
# at /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/10-squelch.conf
# (deploy/hosted/node/kubelet.yaml). Two reasons, either one sufficient:
#
#   1. The drop-in MERGES with k3s's own 00-k3s-defaults.conf per key, so
#      evictionHard adds a memory threshold without dropping k3s's disk ones.
#      The equivalent --eviction-hard flag replaces the whole map.
#   2. A `kubelet-arg:` list in THIS file is discarded entirely when the k3s
#      systemd unit passes any --kubelet-arg of its own. For repeatable flags
#      the command line replaces the config file's list rather than merging
#      with it, and this box's unit passes the UserNamespacesSupport feature
#      gate that way (SETUP.md §2). The settings would be silently ignored.
#
# Check before you believe otherwise:
#
#   grep kubelet-arg /etc/systemd/system/k3s.service
#
# If you are on k3s older than v1.32, neither the drop-in directory nor
# `kubelet-arg: ["config=..."]` exists. Then it has to be individual flags,
# and every kubelet-arg the unit passes has to move into the list below with
# them, or the unit wins and the list is dead:
#
#   kubelet-arg:
#     - "feature-gates=UserNamespacesSupport=true"
#     - "system-reserved=memory=1200Mi"
#     - "eviction-hard=memory.available<200Mi,imagefs.available<5%,nodefs.available<5%"
#     - "fail-swap-on=false"
