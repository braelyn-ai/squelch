# The fleet roller: the timer that puts every tenant onto today's render.
#
# The warden writes a tenant's objects once, at provision time, and never
# revisits them. So bumping `SQUELCH_WARDEN_IMAGE` in `15-warden-config.yaml`
# changes what the NEXT signup gets and nothing at all about the tenants already
# running. This CronJob is what closes that gap: it runs the warden's own binary
# as `squelch-warden roll`, which reads every tenant in the cluster, converges
# ONE whose live DEPLOYMENT no longer matches the render, waits for that rollout
# to finish, and exits.
#
# One per tick, so a fleet with ten tenants behind takes ten ticks - two and a
# half hours on the schedule below. That is the deliberate price and not an
# accident of the loop; see "One tenant per tick" further down.
#
# The Deployment and nothing else, which is the limit worth knowing before this
# timer is trusted with a shape change: a drift report renders and diffs a
# tenant's Deployment alone, so a change that lands on a tenant's Service,
# Ingress, NetworkPolicy or PVC never registers as drift and never triggers a
# roll. Those reach new signups only; existing tenants take them from
# `squelch-control reconcile <label>`, which re-applies all five objects.
#
# Numbered 90 because it sorts after everything it depends on: the ServiceAccount
# it runs as (10), the ConfigMap it renders tenants from (15), the warden itself
# (20), and the tenant-side objects (30-80) it converges. A roller that fired
# before those existed would be a job that halts on an empty cluster for no
# reason.
#
# EDIT BEFORE APPLYING: one value, the `image:` below, and it must be the same
# tag `20-warden.yaml` names. Everything else this process is configured with
# comes from `15-warden-config.yaml` through `envFrom`, which is what keeps the
# roller's render and the warden's identical by construction.
#
# ## Pull-based, and in-cluster, on purpose
#
# It is the warden's own binary under the warden's own ServiceAccount, calling
# library code - not an HTTP route, not a bearer token, not a CI job with a
# kubeconfig. Converging every tenant is the most powerful thing this system can
# do, and nothing outside this box can ask for it: no credential leaves the
# cluster to trigger a roll, and the control plane's bearer token buys no part
# of one.
#
# ## One tenant per tick, and the tick is the check
#
# Zero downtime for a single tenant is not on offer - the strategy is
# `Recreate`, the volume is `ReadWriteOnce`, and the store is one SQLite file,
# so two daemons on one mailbox would corrupt it. What IS on offer is that the
# FLEET is never down, and the thing that buys it is the SCHEDULE rather than
# any check inside a run.
#
# A run that rolled the whole fleet would have to decide, in the seconds after
# each apply, whether the mailbox it had just rolled was healthy - and nothing
# available in those seconds answers that. A finished rollout means the API
# server saw a ready replica; by default a tenant's readiness probe is a TCP
# accept on the daemon's door, and squelchd binds that socket before it builds
# its embedder, on purpose. A pod reports Ready and then dies. A pass that
# trusted the answer would hand the same render to every mailbox in the cluster
# at machine speed and exit converged.
#
# So the run does not try to know. It converges one tenant and leaves, and what
# stands between a bad render and the second mailbox is five minutes of a
# real daemon doing real work - plus the read pass on the next tick, which finds
# a tenant carrying today's render and not serving it, calls it a casualty, and
# refuses to roll anything at all.
#
# Two consequences worth reading before this is trusted:
#
#   - **A fleet mid-roll leaves FAILED Jobs in its history, by design.** Exit 3
#     means "rolled one, more queued", and Kubernetes knows zero and non-zero
#     and nothing else. Nine tenants behind is nine failed Jobs and then a
#     green one. An alert that pages on `kube_job_status_failed` alone will fire
#     on every ordinary image bump. What makes the one failure that matters
#     tellable from those is `podFailurePolicy` in the jobTemplate below, which
#     gets exit 4 a Failed condition of its own; PRODUCTION.md has the query.
#   - **Convergence time is the schedule times the fleet.** The schedule below
#     is the lever, and it trades directly against how long a bad render has to
#     be noticed in. It was fifteen minutes while the fleet was small and is
#     five now: a release reaches every mailbox in a third of the time, and so
#     does a bad one.
#
# ## Levers, and what each one does not do
#
#   kubectl -n warden get cronjob squelch-warden-roll   # last schedule, ACTIVE, suspended
#   kubectl -n warden get jobs                          # one row per run
#   kubectl -n warden logs job/<name>                   # per-tenant lines, then the summary
#   kubectl -n warden patch cronjob squelch-warden-roll -p '{"spec":{"suspend":true}}'
#   kubectl -n warden create job --from=cronjob/squelch-warden-roll roll-now
#
# `concurrencyPolicy: Forbid` below covers exactly one case - a scheduled run
# that overruns its own schedule - and neither lever is that case:
#
#   - **`suspend: true` stops the NEXT tick. It does not stop the run in
#     flight.** The run in flight can still take one mailbox down and bring it
#     back on the render you are suspending because of - which is the whole
#     reason suspend is the right FIRST move and not the only one: it caps the
#     damage at the one tenant already in progress rather than at the fleet. To
#     stop a run that is already going, delete its Job (`kubectl -n warden
#     delete job <name>`), which takes its pod with it: the tenants already
#     rolled stay rolled, the rest wait for whenever this is unsuspended, and
#     the fleet is split-version until then.
#   - **`create job --from=cronjob` is not counted by Forbid.** That command
#     makes a STANDALONE Job with no owner reference back to this CronJob, and
#     the controller counts only the Jobs it owns as active. So a manual run and
#     a scheduled tick can walk the fleet at the same time, at different offsets,
#     with two mailboxes down at once and two writers converging on one tenant.
#     Nothing in the code prevents this; only the recipe below does.
#
# ## Running one by hand, safely
#
#   kubectl -n warden patch cronjob squelch-warden-roll -p '{"spec":{"suspend":true}}'
#   kubectl -n warden get cronjob squelch-warden-roll -o jsonpath='{.status.active}{"\n"}'
#   # empty (or `[]`) means no scheduled run is going. If one is, let it finish.
#   kubectl -n warden create job --from=cronjob/squelch-warden-roll roll-now
#   kubectl -n warden logs -f job/roll-now
#   kubectl -n warden delete job roll-now
#   kubectl -n warden patch cronjob squelch-warden-roll -p '{"spec":{"suspend":false}}'
#
# Suspend FIRST, then check, then create: suspending after the create leaves a
# tick free to start beside the manual run. The delete at the end is not tidiness
# either - a standalone Job is not owned by this CronJob, so no history limit
# collects it, and the next `roll-now` fails on the name that is still there.
#
# ## A run that halts on the same tenant every tick
#
# That signature - the SAME label, run after run, at the same point in the walk -
# is a render the cluster REFUSES, not a flaky tenant. The two stops look alike
# in the summary and are nothing alike underneath:
#
#   - A tenant whose ROLLOUT timed out has already received the render, so its
#     drift is clean, and the run after it stops before applying anything and
#     names it as a casualty. That one moves: the tenant comes back, or a person
#     goes and looks at it.
#   - A tenant whose APPLY was rejected received nothing, so it is still drifted,
#     so it is first in the queue again on the next tick and is rejected again.
#     ~288 failed Jobs a day and not one tenant converged in any of them, at the
#     same label every time. Under one-per-tick pacing this is a FLEET STALL and
#     not just a noisy tenant: the run spends its single attempt on the same
#     label every five minutes, so nothing behind it in fleet order ever moves.
#     The summary's `still behind, one per run: N more` line staying at the same
#     N across runs is the signature.
#
# A reconcile applies a tenant's PVC, NetworkPolicy and Service before its
# Deployment, so the refusal is often not about the thing that queued the tenant.
# Raise `SQUELCH_WARDEN_STORAGE_SIZE` in the same edit as an image bump, against
# a storage class with no `allowVolumeExpansion`, and every drifted tenant dies
# at `volume_failed` on the PVC that a growing image bump had nothing to do with.
# (Alone, that same edit does nothing at all: a PVC is not part of the Deployment
# a drift report diffs, so no tenant is ever queued for it.)
#
# The machine reason in the log says which object the API server refused
# (`volume_failed`, `network_policy_failed`, `service_failed`, `workload_failed`,
# `ingress_failed`, and `render_rejected` for one the dry run already refused in
# the read pass). Suspend, fix the render - usually by putting back whatever was
# changed in `15-warden-config.yaml`, and restarting the warden - then unsuspend.
# `squelch-control reconcile <label>` on that one tenant reproduces the refusal
# with the API server's own message when the reason word is not enough.
#
# `deploy/hosted/PRODUCTION.md` has the exit codes and what to do about each.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: squelch-warden-roll
  namespace: warden
  labels:
    app.kubernetes.io/name: squelch-warden-roll
spec:
  # Every 5 minutes. The two things this is trading off: a human who bumps
  # `SQUELCH_WARDEN_IMAGE` and applies `15-warden-config.yaml` should not have to
  # remember a second command afterwards, and a converged fleet should cost
  # nothing. Five minutes bounds the wait after a deliberate bump, and a run
  # with nothing to do is one short-lived pod plus a handful of reads per tenant
  # (a status, a drift report - and a drift report's apply is `dryRun=All`, which
  # the API server merges and throws away). If you want it sooner than the next
  # tick, use the `create job --from=cronjob` line in the header.
  #
  # It also bounds how long a bump takes, because a run converges one tenant: a
  # fleet with N behind needs N ticks, so this is also "five minutes per tenant",
  # and a four-tenant fleet is current twenty minutes after the bump.
  #
  # IT WAS FIFTEEN. The number came down because a release that takes an hour to
  # reach four mailboxes is one nobody waits for, and an operator who does not
  # wait rolls tenants by hand, which is the `create job --from=cronjob` path
  # that `Forbid` does not cover - so the slow schedule bought its safety back
  # in unsupervised manual runs. What the shortening COSTS is the only safety
  # property this timer has: a bad render now gets five minutes of a real daemon
  # serving real mail to be noticed in rather than fifteen, and the next mailbox
  # takes it after that. Nothing inside a run checks health (see "One tenant per
  # tick" in the header), so this number IS the check. Do not shorten it again
  # without giving the run something better to trust than the clock.
  schedule: "*/5 * * * *"
  # Two rollers walking one fleet is two writers on one mailbox. Forbid means a
  # run that overruns its schedule skips the next tick rather than doubling up.
  # It counts the Jobs this CronJob OWNS and nothing else, so it is no defence
  # against a hand-made `create job --from=cronjob`; see "Levers" in the header.
  concurrencyPolicy: Forbid
  # A missed schedule (a rebooted node, a paused controller) is worth catching up
  # on once, not stampeding. Bounded rather than unset: with no deadline the
  # controller counts every missed start since the last one and stops scheduling
  # entirely past a hundred of them, which is a timer that silently retires.
  #
  # A FRACTION of the period, which is why this moved when the schedule did. At
  # fifteen minutes, 300s was a fifth of a tick; left there against a five-minute
  # schedule it would be the WHOLE period, so a late start would run into the
  # next scheduled one. Survivable - `Forbid` skips it - but it turns a catch-up
  # into a skipped tick for no reason.
  startingDeadlineSeconds: 120
  # A failed roll is the one somebody reads tomorrow; a successful one is a line
  # in a log nobody needs twice.
  #
  # Seventy-two failures kept, because the failure that matters most is the one
  # that repeats: a roll the cluster refuses fails identically every 5 minutes,
  # which is 288 Jobs a day, and a handful of slots means the evidence is gone
  # within the hour and long before anyone reads it.
  #
  # What this is really denominated in is HOURS OF EVIDENCE, not ticks, so it
  # moved with the schedule: 72 ticks at five minutes is the same six hours that
  # 24 bought at fifteen. It is also three times the corpses, each a completed
  # pod holding a few kilobytes of log on a node that carries tenants - which is
  # what stops this being larger still, and makes it the first number to cut if
  # those pods ever start mattering.
  #
  # These corpses are counted by nothing, and that is deliberate: a Job pod ends
  # every run not-ready and stays that way forever, so any pod-health query has
  # to exclude Job-owned pods outright rather than by phase. The dashboard's
  # "Pods not ready" read 3 for a day over three of them before it learned that.
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 72
  jobTemplate:
    spec:
      # A halted roll wants a human, not a retry loop. Whatever stopped it -
      # a render that will not come up, an API server that stopped answering -
      # is not fixed by running the same pass again ten seconds later, and the
      # next scheduled tick is a retry anyway once somebody has looked.
      backoffLimit: 0
      # The ceiling on one pass, so a wedged run cannot hold the `Forbid` lock
      # forever and quietly stop the fleet converging at all. At the schedule
      # above an hour is twelve ticks, so this is also "a wedged run costs the
      # fleet an hour of convergence" - the price of not cutting off a run that
      # is slow but still alive.
      #
      # It does NOT scale with the fleet. A run converges AT MOST ONE tenant, so
      # what it has to cover is the read pass over every tenant (a handful of
      # API calls each, no waiting) plus ONE
      # SQUELCH_WARDEN_READY_TIMEOUT_SECS for the tenant it takes. An hour is
      # far above that and stays that way as the fleet grows; raising it in
      # proportion to the tenant count would only mean a genuinely stuck run
      # holds the lock for hours before anything notices.
      #
      # Being cut off is safe but not free: the tenant that was mid-roll is
      # picked up by the next run, and the fleet is split-version until then.
      activeDeadlineSeconds: 3600
      # THE CASUALTY'S ONLY WAY OUT OF THIS POD. It changes no behaviour at all:
      # with `backoffLimit: 0` the Job already failed on the first failed pod and
      # already never retried, and it still does both. What it changes is the
      # WORD Kubernetes writes on the failure, which is the only part of an exit
      # code that survives into metrics.
      #
      # kube-state-metrics does not export a one-shot pod's exit code. It builds
      # `kube_pod_container_status_last_terminated_exitcode` from a container's
      # `lastState`, and a pod that runs once and exits puts its code in
      # `state.terminated` and leaves `lastState` empty - so the query
      # PRODUCTION.md recommended for two months matched nothing, ever, on any
      # cluster. A frozen fleet was silent. That is what this rule fixes, and the
      # method is to make the Job controller do the classifying: a pod failure
      # matching a `FailJob` rule sets the Job's Failed condition reason to
      # `PodFailurePolicy` instead of `BackoffLimitExceeded`, and the reason IS
      # exported, as a label on `kube_job_status_failed`.
      #
      # So exit 4 becomes a different series from every other nonzero exit, which
      # is the whole ask: 4 pages, everything else goes on a board. See
      # PRODUCTION.md, "Alerting on this, without alerting on normal", for the
      # query, the kube-state-metrics wrinkle underneath it, and a probe you can
      # run in sixty seconds to prove the whole path still works.
      #
      # ONLY exit 4 belongs here, and only `FailJob`.
      #
      #   - Adding 1, 2 or 3 would spend the one bit this mechanism has on codes
      #     that are permanent by design (a stranded mailbox raises 1 every tick
      #     forever) and put the casualty back in a bucket somebody mutes.
      #   - `action: Ignore` is not an option for anything, however tempting it
      #     looks for the ordinary exit 3 that leaves failed Jobs lying around.
      #     Ignore means the failure does not count against `backoffLimit`, and a
      #     Job under its backoff limit CREATES A REPLACEMENT POD - so the roll
      #     that just took a mailbox down would immediately run again. "A halted
      #     roll wants a human, not a retry loop" is the rule above, and Ignore
      #     is that retry loop with a quieter name.
      #   - No `onPodConditions` rule either, for the same reason: an evicted or
      #     preempted roll is a failed Job today, and it should stay one.
      #
      # `containerName` must stay `roll`, matching the container below. A rule
      # with no containerName matches any container in the pod, which is the same
      # thing while this pod has one container and a silent widening the day it
      # grows a sidecar.
      podFailurePolicy:
        rules:
          - action: FailJob
            onExitCodes:
              containerName: roll
              operator: In
              values: [4]
      template:
        metadata:
          # NOT `app.kubernetes.io/name: squelch-warden`. That label is the
          # `squelch-warden` Service's selector, and a roller pod carrying it
          # would be enrolled as an endpoint of the warden's ClusterIP - so some
          # fraction of the control plane's calls would be routed to a pod that
          # serves nothing and exits in a minute. The NetworkPolicy at the
          # bottom of this file is what covers this label instead.
          labels:
            app.kubernetes.io/name: squelch-warden-roll
        spec:
          restartPolicy: Never
          serviceAccountName: squelch-warden
          # It talks to the API server, so it needs the token, exactly as the
          # serving pod does. It needs NO new RBAC: `roll` calls `list`/`get` on
          # Secrets, `get` on Deployments, and server-side applies (including
          # the drift report's dry run) on the five tenant objects - every one of
          # them a verb already in `10-warden-rbac.yaml`. It never execs, it
          # never patches a Secret (the cancellation marker is `delete`'s write,
          # and this job never cancels anything), and it never deletes a
          # Deployment, because it skips the tenants where a repair would mean
          # deleting one.
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 10002
            runAsGroup: 10002
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: roll
              # 1. EDIT ME. The SAME warden image as `20-warden.yaml`, always.
              # This binary is the renderer; a roller on an older image renders
              # older tenants.
              image: ghcr.io/braelyn-ai/squelch-warden:daemon-0.0.4
              imagePullPolicy: IfNotPresent
              # The image's entrypoint IS the binary, so this is the whole
              # command line. Add `--dry-run` to make the timer report what it
              # would change and change nothing - useful for a week after a
              # shape change lands, and useless as a permanent setting.
              args: ["roll"]
              # Every knob this process reads, from `15-warden-config.yaml`:
              # the same object the warden Deployment reads, which is what makes
              # "the roller renders what the warden renders" a property of the
              # cluster rather than of an operator diffing two files. Nearly
              # every value in it is an input to the tenant Deployment this
              # process renders, and two copies that disagree take turns
              # rewriting the same tenant every five minutes with each half
              # behaving correctly. Nothing is restated below: a container `env:`
              # name outranks the same name from `envFrom`, silently, and one
              # override here is that divergence with extra steps.
              envFrom:
                - configMapRef:
                    name: squelch-warden-config
              env:
                # `roll` serves nothing and checks no bearer, but the config
                # validator requires a token of real length before anything
                # starts. The real one, not a placeholder: a second secret to
                # keep in sync would be a second thing to get wrong.
                - name: SQUELCH_WARDEN_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: squelch-warden
                      key: token
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              # It spends its life waiting on rollouts. The same bounds the
              # serving pod runs under are more than enough.
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
          volumes:
            # Nothing is written to disk. This exists so the read-only root
            # filesystem has somewhere for a library to put a scratch file.
            - name: tmp
              emptyDir: {}
---
# The roller's own policy, because the roller's own pod label keeps it out of
# the warden's (`50-warden-networkpolicy.yaml`) - and a pod holding an API token
# that no policy selects is a pod with unrestricted egress.
#
# Strictly less than the warden's: no ingress rule at all, because this pod
# listens on nothing and answers nobody. Egress is DNS and the API server,
# which is the entire list of things a roll touches.
#
# CHECK BOTH CIDRS. They are the same two addresses as in
# `50-warden-networkpolicy.yaml`, for the same reason (kube-router filters
# egress AFTER the Service VIP is DNATed, so both the VIP and the real endpoint
# have to be allowed). Change one file's copy and you have to change the other's;
# the symptom of forgetting is every roll halting on the first tenant with
# `fleet_list_failed`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: squelch-warden-roll
  namespace: warden
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: squelch-warden-roll
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        # CHECK ME. The API server's Service VIP, kept for CNIs that evaluate
        # pre-DNAT.
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        # CHECK ME. The API server's real endpoint - on a single-node k3s, the
        # node's own IP, which is what kube-router actually filters on.
        - ipBlock:
            cidr: 5.78.205.240/32
      ports:
        - protocol: TCP
          port: 6443
