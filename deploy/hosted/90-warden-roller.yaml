# The fleet roller: the timer that puts every tenant onto today's render.
#
# The warden writes a tenant's objects once, at provision time, and never
# revisits them. So bumping `SQUELCH_WARDEN_IMAGE` in `15-warden-config.yaml`
# changes what the NEXT signup gets and nothing at all about the tenants already
# running. This CronJob is what closes that gap: it runs the warden's own binary
# as `squelch-warden roll`, which walks every tenant in the cluster, reconciles
# the ones whose live DEPLOYMENT no longer matches the render, and waits for
# each rollout to finish before it touches the next one.
#
# The Deployment and nothing else, which is the limit worth knowing before this
# timer is trusted with a shape change: a drift report renders and diffs a
# tenant's Deployment alone, so a change that lands on a tenant's Service,
# Ingress, NetworkPolicy or PVC never registers as drift and never triggers a
# roll. Those reach new signups only; existing tenants take them from
# `squelch-control reconcile <label>`, which re-applies all five objects.
#
# Numbered 90 because it sorts after everything it depends on: the ServiceAccount
# it runs as (10), the ConfigMap it renders tenants from (15), the warden itself
# (20), and the tenant-side objects (30-80) it converges. A roller that fired
# before those existed would be a job that halts on an empty cluster for no
# reason.
#
# EDIT BEFORE APPLYING: one value, the `image:` below, and it must be the same
# tag `20-warden.yaml` names. Everything else this process is configured with
# comes from `15-warden-config.yaml` through `envFrom`, which is what keeps the
# roller's render and the warden's identical by construction.
#
# ## Pull-based, and in-cluster, on purpose
#
# It is the warden's own binary under the warden's own ServiceAccount, calling
# library code - not an HTTP route, not a bearer token, not a CI job with a
# kubeconfig. Converging every tenant is the most powerful thing this system can
# do, and nothing outside this box can ask for it: no credential leaves the
# cluster to trigger a roll, and the control plane's bearer token buys no part
# of one.
#
# ## Sequential, one tenant at a time
#
# Zero downtime for a single tenant is not on offer - the strategy is
# `Recreate`, the volume is `ReadWriteOnce`, and the store is one SQLite file,
# so two daemons on one mailbox would corrupt it. What IS on offer is that the
# FLEET is never down: one tenant, a verified rollout, then the next, and the
# first tenant that does not come back ends the run. A bad render costs exactly
# one tenant.
#
# ## Levers, and what each one does not do
#
#   kubectl -n warden get cronjob squelch-warden-roll   # last schedule, ACTIVE, suspended
#   kubectl -n warden get jobs                          # one row per run
#   kubectl -n warden logs job/<name>                   # per-tenant lines, then the summary
#   kubectl -n warden patch cronjob squelch-warden-roll -p '{"spec":{"suspend":true}}'
#   kubectl -n warden create job --from=cronjob/squelch-warden-roll roll-now
#
# `concurrencyPolicy: Forbid` below covers exactly one case - a scheduled run
# that overruns its own schedule - and neither lever is that case:
#
#   - **`suspend: true` stops the NEXT tick. It does not stop the run in
#     flight.** A roll that is halfway through the fleet keeps going, keeps
#     applying, and keeps taking one mailbox down at a time. Suspending is the
#     right first move on a halt you do not understand, and it is not a stop
#     button. To stop a run that is already going, delete its Job
#     (`kubectl -n warden delete job <name>`), which takes its pod with it: the
#     tenants already rolled stay rolled, the rest are picked up by the next run,
#     and the fleet is split-version until then.
#   - **`create job --from=cronjob` is not counted by Forbid.** That command
#     makes a STANDALONE Job with no owner reference back to this CronJob, and
#     the controller counts only the Jobs it owns as active. So a manual run and
#     a scheduled tick can walk the fleet at the same time, at different offsets,
#     with two mailboxes down at once and two writers converging on one tenant.
#     Nothing in the code prevents this; only the recipe below does.
#
# ## Running one by hand, safely
#
#   kubectl -n warden patch cronjob squelch-warden-roll -p '{"spec":{"suspend":true}}'
#   kubectl -n warden get cronjob squelch-warden-roll -o jsonpath='{.status.active}{"\n"}'
#   # empty (or `[]`) means no scheduled run is going. If one is, let it finish.
#   kubectl -n warden create job --from=cronjob/squelch-warden-roll roll-now
#   kubectl -n warden logs -f job/roll-now
#   kubectl -n warden delete job roll-now
#   kubectl -n warden patch cronjob squelch-warden-roll -p '{"spec":{"suspend":false}}'
#
# Suspend FIRST, then check, then create: suspending after the create leaves a
# tick free to start beside the manual run. The delete at the end is not tidiness
# either - a standalone Job is not owned by this CronJob, so no history limit
# collects it, and the next `roll-now` fails on the name that is still there.
#
# ## A run that halts on the same tenant every tick
#
# That signature - the SAME label, run after run, at the same point in the walk -
# is a render the cluster REFUSES, not a flaky tenant. The two stops look alike
# in the summary and are nothing alike underneath:
#
#   - A tenant whose ROLLOUT timed out has already received the render, so its
#     drift is clean, and the run after it stops before applying anything and
#     names it as a casualty. That one moves: the tenant comes back, or a person
#     goes and looks at it.
#   - A tenant whose APPLY was rejected received nothing, so it is still drifted,
#     so it is first in the queue again on the next tick and is rejected again.
#     ~96 failed Jobs a day and not one tenant converged in any of them, at the
#     same label every time.
#
# A reconcile applies a tenant's PVC, NetworkPolicy and Service before its
# Deployment, so the refusal is often not about the thing that queued the tenant.
# Raise `SQUELCH_WARDEN_STORAGE_SIZE` in the same edit as an image bump, against
# a storage class with no `allowVolumeExpansion`, and every drifted tenant dies
# at `volume_failed` on the PVC that a growing image bump had nothing to do with.
# (Alone, that same edit does nothing at all: a PVC is not part of the Deployment
# a drift report diffs, so no tenant is ever queued for it.)
#
# The machine reason in the log says which object the API server refused
# (`volume_failed`, `network_policy_failed`, `service_failed`, `workload_failed`,
# `ingress_failed`, and `render_rejected` for one the dry run already refused in
# the read pass). Suspend, fix the render - usually by putting back whatever was
# changed in `15-warden-config.yaml`, and restarting the warden - then unsuspend.
# `squelch-control reconcile <label>` on that one tenant reproduces the refusal
# with the API server's own message when the reason word is not enough.
#
# `deploy/hosted/PRODUCTION.md` has the exit codes and what to do about each.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: squelch-warden-roll
  namespace: warden
  labels:
    app.kubernetes.io/name: squelch-warden-roll
spec:
  # Every 15 minutes. The two things this is trading off: a human who bumps
  # `SQUELCH_WARDEN_IMAGE` and applies `15-warden-config.yaml` should not have to
  # remember a second command afterwards, and a converged fleet should cost
  # nothing. Fifteen minutes bounds the wait after a deliberate bump, and a run
  # with nothing to do is one short-lived pod plus a handful of reads per tenant
  # (a status, a drift report - and a drift report's apply is `dryRun=All`, which
  # the API server merges and throws away). If you want it sooner than the next
  # tick, use the `create job --from=cronjob` line in the header.
  schedule: "*/15 * * * *"
  # Two rollers walking one fleet is two writers on one mailbox. Forbid means a
  # run that overruns its schedule skips the next tick rather than doubling up.
  # It counts the Jobs this CronJob OWNS and nothing else, so it is no defence
  # against a hand-made `create job --from=cronjob`; see "Levers" in the header.
  concurrencyPolicy: Forbid
  # A missed schedule (a rebooted node, a paused controller) is worth catching up
  # on once, not stampeding. Bounded rather than unset: with no deadline the
  # controller counts every missed start since the last one and stops scheduling
  # entirely past a hundred of them, which is a timer that silently retires.
  startingDeadlineSeconds: 300
  # A failed roll is the one somebody reads tomorrow; a successful one is a line
  # in a log nobody needs twice.
  #
  # Twenty-four failures kept, because the failure that matters most is the one
  # that repeats: a roll the cluster refuses fails identically every 15 minutes,
  # which is 96 Jobs a day, and a handful of slots means the evidence is gone
  # within the hour and long before anyone reads it. Twenty-four is six hours of
  # ticks. Each one is a completed pod holding a few kilobytes of log on a node
  # that carries tenants, which is what stops this being a much larger number;
  # the real fix is an alert on `kube_job_status_failed{namespace="warden"}`,
  # which is an open item in PRODUCTION.md.
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 24
  jobTemplate:
    spec:
      # A halted roll wants a human, not a retry loop. Whatever stopped it -
      # a render that will not come up, an API server that stopped answering -
      # is not fixed by running the same pass again ten seconds later, and the
      # next scheduled tick is a retry anyway once somebody has looked.
      backoffLimit: 0
      # The ceiling on one pass, so a wedged run cannot hold the `Forbid` lock
      # forever and quietly stop the fleet converging at all. Size it above
      # SQUELCH_WARDEN_READY_TIMEOUT_SECS times the number of tenants that could
      # be drifted at once, or a growing fleet starts getting cut off mid-walk.
      # Being cut off is safe but not free: the tenants already rolled stay
      # rolled, the rest are picked up by the next run, and the fleet is
      # split-version until then.
      activeDeadlineSeconds: 3600
      template:
        metadata:
          # NOT `app.kubernetes.io/name: squelch-warden`. That label is the
          # `squelch-warden` Service's selector, and a roller pod carrying it
          # would be enrolled as an endpoint of the warden's ClusterIP - so some
          # fraction of the control plane's calls would be routed to a pod that
          # serves nothing and exits in a minute. The NetworkPolicy at the
          # bottom of this file is what covers this label instead.
          labels:
            app.kubernetes.io/name: squelch-warden-roll
        spec:
          restartPolicy: Never
          serviceAccountName: squelch-warden
          # It talks to the API server, so it needs the token, exactly as the
          # serving pod does. It needs NO new RBAC: `roll` calls `list`/`get` on
          # Secrets, `get` on Services and Deployments, and server-side applies
          # (including the drift report's dry run) on the five tenant objects -
          # every one of them a verb already in `10-warden-rbac.yaml`. It never
          # execs and it never deletes a Deployment, because it skips the
          # tenants where a repair would mean deleting one.
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 10002
            runAsGroup: 10002
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: roll
              # 1. EDIT ME. The SAME warden image as `20-warden.yaml`, always.
              # This binary is the renderer; a roller on an older image renders
              # older tenants.
              image: ghcr.io/braelyn-ai/squelch-warden:daemon-0.0.1
              imagePullPolicy: IfNotPresent
              # The image's entrypoint IS the binary, so this is the whole
              # command line. Add `--dry-run` to make the timer report what it
              # would change and change nothing - useful for a week after a
              # shape change lands, and useless as a permanent setting.
              args: ["roll"]
              # Every knob this process reads, from `15-warden-config.yaml`:
              # the same object the warden Deployment reads, which is what makes
              # "the roller renders what the warden renders" a property of the
              # cluster rather than of an operator diffing two files. Nearly
              # every value in it is an input to the tenant Deployment this
              # process renders, and two copies that disagree take turns
              # rewriting the same tenant every quarter hour with each half
              # behaving correctly. Nothing is restated below: a container `env:`
              # name outranks the same name from `envFrom`, silently, and one
              # override here is that divergence with extra steps.
              envFrom:
                - configMapRef:
                    name: squelch-warden-config
              env:
                # `roll` serves nothing and checks no bearer, but the config
                # validator requires a token of real length before anything
                # starts. The real one, not a placeholder: a second secret to
                # keep in sync would be a second thing to get wrong.
                - name: SQUELCH_WARDEN_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: squelch-warden
                      key: token
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              # It spends its life waiting on rollouts. The same bounds the
              # serving pod runs under are more than enough.
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
          volumes:
            # Nothing is written to disk. This exists so the read-only root
            # filesystem has somewhere for a library to put a scratch file.
            - name: tmp
              emptyDir: {}
---
# The roller's own policy, because the roller's own pod label keeps it out of
# the warden's (`50-warden-networkpolicy.yaml`) - and a pod holding an API token
# that no policy selects is a pod with unrestricted egress.
#
# Strictly less than the warden's: no ingress rule at all, because this pod
# listens on nothing and answers nobody. Egress is DNS and the API server,
# which is the entire list of things a roll touches.
#
# CHECK BOTH CIDRS. They are the same two addresses as in
# `50-warden-networkpolicy.yaml`, for the same reason (kube-router filters
# egress AFTER the Service VIP is DNATed, so both the VIP and the real endpoint
# have to be allowed). Change one file's copy and you have to change the other's;
# the symptom of forgetting is every roll halting on the first tenant with
# `fleet_list_failed`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: squelch-warden-roll
  namespace: warden
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: squelch-warden-roll
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        # CHECK ME. The API server's Service VIP, kept for CNIs that evaluate
        # pre-DNAT.
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        # CHECK ME. The API server's real endpoint - on a single-node k3s, the
        # node's own IP, which is what kube-router actually filters on.
        - ipBlock:
            cidr: 5.78.205.240/32
      ports:
        - protocol: TCP
          port: 6443
