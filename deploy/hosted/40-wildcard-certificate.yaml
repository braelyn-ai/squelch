# The wildcard certificate every tenant vhost is served with, and the warden's
# own certificate.
#
# DNS-01, not HTTP-01, and that is not a preference: a wildcard cannot be issued
# any other way. The example below is Cloudflare because it is the one most
# people have; for another provider, swap the `solvers` block for that
# provider's cert-manager solver and change nothing else. The DNS provider only
# ever sees a TXT record on `_acme-challenge`, never a tenant's name.
#
# EDIT BEFORE APPLYING: the email, the domain (three places), and the solver.
#
# The DNS credential is NOT in this file. It is a Secret named `acme-dns-token`
# in the `cert-manager` namespace, which the solver below references; create it
# with `kubectl create secret` (see `acme-dns-token.example.yaml`) so a token
# with edit rights on your zone never lands in a file, let alone in git.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # EDIT ME. Where expiry warnings go.
    email: you@example.com
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: acme-dns-token
              key: api-token
---
# The wildcard, in the TENANT namespace: a certificate can only be used by an
# Ingress in the namespace its Secret lives in, and every tenant Ingress is in
# `tenants`. The warden's config points at this Secret name.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: passband-wildcard
  namespace: tenants
spec:
  secretName: passband-wildcard-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    # EDIT ME. The wildcard covers `<label>.passband.email` for every tenant.
    # One label deep only, which is exactly what a tenant hostname is.
    - "*.passband.email"
---
# The warden's own host. Separate because it lives in a different namespace, and
# a Secret does not cross one.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: warden
  namespace: warden
spec:
  secretName: warden-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    # EDIT ME
    - warden.passband.email
