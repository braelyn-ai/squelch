# The wildcard certificate every tenant vhost is served with, and the warden's
# own certificate.
#
# DNS-01, not HTTP-01, and that is not a preference: a wildcard cannot be issued
# any other way. The example below is Cloudflare because it is the one most
# people have; for another provider, swap the `solvers` block for that
# provider's cert-manager solver and change nothing else. The DNS provider only
# ever sees a TXT record on `_acme-challenge`, never a tenant's name.
#
# EDIT BEFORE APPLYING: the email, the domain (three places), and the solver.
#
# The DNS credential is NOT in this file. It is a Secret named `acme-dns-token`
# in the `cert-manager` namespace, which the solver below references; create it
# with `kubectl create secret` (see `acme-dns-token.example.yaml`) so a token
# with edit rights on your zone never lands in a file, let alone in git.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # EDIT ME. Where expiry warnings go.
    email: bboynton97@gmail.com
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      # DNS-01 is scoped to the TENANT zone: it is the only solver that can
      # issue the wildcard, and the DNS token's blast radius stays one zone.
      - selector:
          dnsZones:
            # EDIT ME with the tenant base domain.
            - passband.email
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: acme-dns-token
              key: api-token
      # Catch-all for single-host certificates on OTHER zones (the warden lives
      # on the product domain, not the tenant one). HTTP-01 needs port 80 to
      # reach Traefik and no DNS credential at all. If the product zone shares
      # the same DNS account, widening the selector above works too; this way
      # needs nothing.
      - http01:
          ingress:
            ingressClassName: traefik
---
# The wildcard, in the TENANT namespace: a certificate can only be used by an
# Ingress in the namespace its Secret lives in, and every tenant Ingress is in
# `tenants`. The warden's config points at this Secret name.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: passband-wildcard
  namespace: tenants
spec:
  secretName: passband-wildcard-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    # EDIT ME. The wildcard covers `<label>.passband.email` for every tenant.
    # One label deep only, which is exactly what a tenant hostname is.
    - "*.passband.email"
---
# The warden's own host. Separate because it lives in a different namespace (a
# Secret does not cross one) and on a different DOMAIN: the tenant zone means
# exactly one thing, a tenant, so internal surfaces live on the product domain.
# A single host needs no wildcard, so this issues over the HTTP-01 catch-all.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: warden
  namespace: warden
spec:
  secretName: warden-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    # EDIT ME
    - warden.passband.app
