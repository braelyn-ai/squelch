# Monitoring: the on-box half. Everything heavy (storage, dashboards, alerting,
# external probes) lives on Railway (deploy/monitoring/); this file is only the
# collectors, sized to steal as little tenant headroom as possible (~200 MB
# between the three of them).
#
# prometheus-agent scrapes locally and PUSHES via remote_write, so carrier's
# firewall stays inbound 22/80/443 — nothing here listens to the internet
# (node-exporter binds :9100 on the host, which the Hetzner firewall drops).
#
# The push needs one secret, created imperatively (see
# remote-write-auth.example.yaml): the basic-auth password for the Railway
# Prometheus receiver, same value as PROM_REMOTE_WRITE_PASSWORD there.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    # node-exporter needs hostPath / hostNetwork / hostPID, which "restricted"
    # forbids. Stated explicitly so nobody "fixes" this namespace to match
    # tenants and silently kills the node metrics.
    pod-security.kubernetes.io/enforce: privileged
---
# ---------------------------------------------------------------- node-exporter
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring
  labels:
    app: node-exporter
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      hostNetwork: true
      hostPID: true
      containers:
        - name: node-exporter
          image: quay.io/prometheus/node-exporter:v1.9.1
          args:
            - --path.rootfs=/host
            - --web.listen-address=:9100
          ports:
            - containerPort: 9100
              name: metrics
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: root
              mountPath: /host
              readOnly: true
              mountPropagation: HostToContainer
      volumes:
        - name: root
          hostPath:
            path: /
      tolerations:
        - operator: Exists
---
# ----------------------------------------------------------- kube-state-metrics
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
rules:
  # Deliberately narrower than upstream's default: no secrets, no configmaps.
  # The --resources flag on the container must stay in lockstep with this list.
  - apiGroups: [""]
    resources: [pods, nodes, namespaces, services, endpoints, persistentvolumeclaims, persistentvolumes, resourcequotas, limitranges]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments, daemonsets, statefulsets, replicasets]
    verbs: [list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.14.0
          args:
            - --resources=pods,nodes,namespaces,services,endpoints,persistentvolumeclaims,persistentvolumes,resourcequotas,limitranges,deployments,daemonsets,statefulsets,replicasets,jobs,cronjobs,ingresses
          ports:
            - containerPort: 8080
              name: metrics
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
# ------------------------------------------------------------ prometheus-agent
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-agent
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-agent
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, nodes/proxy, services, endpoints, pods]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics, /metrics/cadvisor]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-agent
subjects:
  - kind: ServiceAccount
    name: prometheus-agent
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-agent
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      scrape_timeout: 10s
      external_labels:
        cluster: carrier

    scrape_configs:
      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [monitoring]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: node-exporter
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: "9100"
            action: keep

      - job_name: kubelet
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          insecure_skip_verify: true
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token

      - job_name: cadvisor
        kubernetes_sd_configs:
          - role: node
        scheme: https
        metrics_path: /metrics/cadvisor
        tls_config:
          insecure_skip_verify: true
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        metric_relabel_configs:
          # cadvisor is the cardinality hog; keep only pod-attributed series.
          - source_labels: [pod]
            regex: ""
            action: drop

      - job_name: kube-state-metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [monitoring]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: kube-state-metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: "8080"
            action: keep

      - job_name: traefik
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [kube-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: traefik
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep

      - job_name: cert-manager
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [cert-manager]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: cert-manager
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: "9402"
            action: keep

    remote_write:
      - url: https://prometheus-production-2d43.up.railway.app/api/v1/write
        basic_auth:
          username: remote
          password_file: /etc/prometheus/secrets/remote-write/password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-agent
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus-agent
    spec:
      serviceAccountName: prometheus-agent
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --agent
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.agent.path=/data
          ports:
            - containerPort: 9090
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /data
            - name: remote-write-auth
              mountPath: /etc/prometheus/secrets/remote-write
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: config
          configMap:
            name: prometheus-agent
        - name: data
          emptyDir: {}
        - name: remote-write-auth
          secret:
            secretName: remote-write-auth
