# The warden's identity in the cluster, and the exact list of things it may do.
#
# A Role, bound into `tenants`. Not a ClusterRole, not cluster-admin, and not a
# second Role in `warden`: the provisioner has no permission to read its own
# Secret, restart itself, or look at anything outside the tenant namespace. If
# somebody gets the warden's bearer token, this list is the blast radius.
#
# Every rule is a verb `squelch-warden/src/cluster.rs` actually calls, per
# resource, and nothing else. Server-side apply needs `create` as well as
# `patch`, because an apply that has to create the object is authorized as both.
#
# What is deliberately absent, and the absence is load-bearing:
#
#   - `delete` on persistentvolumeclaims. The mail. `DELETE /v1/tenants/{label}`
#     takes the workload down; the volume stays, and nothing the control plane
#     can call removes it. Destroying a tenant for real is an operator with
#     kubectl.
#   - `list` on pods with anything but a selector, `get` on secrets outside this
#     namespace, and every verb on every kind not named here.
#
# What is present and was not in the first cut: `delete` and `list` on secrets.
# The pending sweep needs both, because an abandoned signup parks an identity
# Secret that nothing will ever open and that holds a public subdomain against
# everyone else, and the control plane cannot see it to ask about it. Being
# honest about the cost: this Role can now delete any Secret in `tenants`, so
# the "the service that writes a tenant's key cannot lose it" claim is now a
# claim about the CODE (which deletes only an identity Secret, only while that
# tenant is pending, only past the TTL, and never a credential Secret) rather
# than about RBAC. Credential Secrets and volumes are still beyond it entirely.
#
# `get` on services is a MIGRATION verb with an expiry date. Telling a cancelled
# tenant from an interrupted reconcile is the marker's job now
# (`passband.email/cancelled-at`, below), but every tenant cancelled by a warden
# that predates the marker carries no marker at all - and reading one of those
# as an interrupted reconcile would rebuild a closed mailbox on its stored
# credential. The old signal still separates them: a teardown takes the Service
# before the Deployment, and every path that puts a workload up applies the
# Service first, so a Service standing over a missing Deployment is a job to
# finish and its absence is a teardown. APPLY THIS BEFORE THE IMAGE, not after -
# a warden that reaches for the verb without the Role gets a 403 and halts its
# fleet roll on the first workload-less tenant it meets. Drop the verb, and
# `Warden::torn_down_before_the_marker` with it, once no tenant cancelled by the
# old warden is left.
#
# The other half of the bound on this token is Pod Security Admission on the
# `tenants` namespace (see 00-namespaces.yaml). Holding it lets you create a
# workload here; PSA decides what KIND of workload, and at `restricted` that is
# a non-root pod with no capabilities, no host namespaces and no host paths. A
# stolen token is a tenant-shaped pod, not a node escape.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: squelch-warden
  namespace: warden
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: squelch-warden
  namespace: tenants
rules:
  # Identity and credential Secrets. `get` for the status derivation and the
  # cancellation marker, `list` for the pending sweep, `create`/`patch` for the
  # writes, `delete` for the sweep alone: see the header.
  #
  # `patch` covers two different writes now. One is the ordinary server-side
  # apply of a Secret. The other is a JSON merge patch of a single annotation -
  # `passband.email/cancelled-at`, which `delete` stamps on the identity Secret
  # before it removes anything - and it is a merge patch precisely because an
  # apply would declare the whole object and take that Secret's age key with it.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "patch", "delete"]
  # The tenant's data volume. Applied, never read back and never deleted.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "patch"]
  # `get` is read on ONE path and only until the migration is over: a tenant
  # with no workload and no cancellation marker, where a surviving Service is
  # what says an interrupted reconcile rather than a closed account. See the
  # header for when it goes.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "create", "patch", "delete"]
  # Read only, and by label selector. The warden never creates a pod directly;
  # the Deployment does. This is the readiness wait during a provision.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  # `squelchd pair`, run inside the tenant's own pod. This is the one rule here
  # that can reach a tenant's data, and it is why the warden's token matters.
  # BOTH verbs are load-bearing: the API server maps the HTTP verb to the RBAC
  # verb, so SPDY exec (POST) authorizes as `create` while WebSocket exec (GET,
  # which is what kube-rs sends) authorizes as `get`. Trimming "unused" get here
  # broke pairing with a 403 the first time this ran against a real cluster.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  # `get` for the status derivation (a ready replica is what `active` means).
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: squelch-warden
  namespace: tenants
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: squelch-warden
subjects:
  - kind: ServiceAccount
    name: squelch-warden
    namespace: warden
