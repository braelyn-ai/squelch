# Prometheus on Railway: the storage half of hosted monitoring.
#
# Metrics arrive two ways:
#   1. remote_write PUSHED from prometheus-agent on carrier (see
#      deploy/hosted/80-monitoring.yaml) — carrier's firewall stays inbound
#      22/80/443 because the agent only ever dials OUT to this receiver.
#   2. Blackbox probes scraped from here, so uptime is measured from OUTSIDE
#      the box being watched. A dead carrier still produces probe_success==0.
#
# Auth: every route (including /api/v1/write) sits behind basic auth via
# web.yml, which the entrypoint renders from env at boot. The scrape of our own
# blackbox sidecar rides Railway private networking and needs no auth.

global:
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://signup.passband.app/healthz
          - https://warden.passband.app/healthz
          - https://passband.app/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox.railway.internal:9115

  # THE LLM CANARY: a real claude-opus-5 call through the public gateway path
  # every tenant daemon uses, mirroring the daemon's full request shape, with a
  # dedicated canary virtual key (see deploy/monitoring/blackbox/blackbox.yml).
  # probe_success{job="blackbox-bifrost-llm"} == 0 means LLM calls are NOT
  # going through in production.
  #
  # Its own job because it spends real money per probe, and the interval is a
  # COST knob, not a freshness one. A probe now carries a system block and a
  # real 2000-token ceiling (thinking bills against it), so ~250 in + a few
  # hundred out at $5/$25 per MTok is on the order of a cent a call: ~$25/month
  # at 15m, and ~$70/month at the 5m this used to run. The outage it exists to
  # catch ran for TWO DAYS, so 15-minute detection is far better than needed —
  # widen it further if the bill annoys you, and do not narrow it without
  # redoing that arithmetic.
  #
  # scrape_timeout is 60s because a reasoning model on a cold prompt cache is
  # not a 10s request; it must stay >= the module's own timeout.
  - job_name: blackbox-bifrost-llm
    metrics_path: /probe
    scrape_interval: 15m
    scrape_timeout: 60s
    params:
      module: [bifrost_llm]
    static_configs:
      - targets:
          - https://bifrost.passband.app/anthropic/v1/messages
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox.railway.internal:9115

  - job_name: blackbox-exporter
    static_configs:
      - targets: [blackbox.railway.internal:9115]

  - job_name: prometheus
    basic_auth:
      username: remote
      password_file: /etc/prometheus/password
    static_configs:
      - targets: [localhost:9090]
