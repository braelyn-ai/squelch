# Blackbox exporter modules. No public domain is ever minted for this service —
# Prometheus reaches it over Railway private networking only.
#
# THIS FILE IS A TEMPLATE: entrypoint.sh renders __BIFROST_CANARY_KEY__ and
# __CANARY_MODEL__ from Railway service variables at boot (same pattern as
# prometheus's web.yml). Never put the key itself here.
modules:
  # follow redirects, require a 2xx, record TLS expiry
  # (probe_ssl_earliest_cert_expiry comes free with any https probe).
  http_2xx:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: true
      fail_if_not_ssl: true

  # THE LLM CANARY: a real model call through the exact public path every
  # tenant daemon uses (gateway auth -> virtual-key model allowlist -> upstream
  # call). The 2026-08-19 outage — every fleet LLM call 400ing at the gateway
  # for two days — was invisible to http_2xx probes because the gateway itself
  # was up; only a real call fails the way triage fails.
  # probe_success{job="blackbox-bifrost-llm"} is the fleet-level "are LLM calls
  # going through" signal.
  #
  # THE BODY MUST MIRROR `classify_anthropic` IN squelch-core/src/triage/llm.rs.
  # The first cut of this module sent only model+max_tokens+messages, which
  # proved routing, auth, the allowlist, and budget — and nothing about the
  # request shape triage actually uses. That gap is dangerous rather than
  # merely incomplete: if the gateway ever drops `output_config.format`, the
  # model answers prose, the daemon fails `json_parse` (deliberately a
  # ROW-level failure, so the row is marked processed on its heuristic seed),
  # and a thin canary stays GREEN through a silent re-run of the original
  # outage. So this body carries every element the daemon sends:
  #   - a `system` block with `cache_control: ephemeral`  (prompt caching)
  #   - `output_config.format` as a json_schema            (structured output)
  #   - `output_config.effort`                             (new in daemon-0.0.2)
  # and the assertions below prove the schema was actually honored, not just
  # that some 2xx came back.
  #
  # HONEST LIMIT: a silently DROPPED `effort` cannot be detected from the
  # response — nothing echoes it. This proves effort does not BREAK the call;
  # the daemon's usage ledger is where a dropped effort would show up as cost.
  #
  # MAX_TOKENS IS NOT 16. Thinking tokens bill against this ceiling and run
  # before the first output byte, so a budget sized for the JSON alone
  # truncates every call before the verdict exists — the exact bug
  # daemon-0.0.2 fixed by moving MAX_TOKENS 400 -> 8000. 2000 is well clear of
  # a one-field verdict at low effort while keeping the probe cheap; the
  # truncation assertion below catches it loudly if that ever stops being true.
  #
  # The key is a DEDICATED canary virtual key (Bifrost UI: name `canary`, the
  # triage model list, a few dollars of monthly budget) so a probe never spends
  # tenant budget and a tenant rotation never breaks the canary. If
  # BLACKBOX_BIFROST_CANARY_KEY is unset the module renders with a dead key and
  # the probe fails visibly — configure it, don't delete the module.
  #
  # TYPE THAT MODEL LIST WITH NO SPACES AFTER THE COMMAS. The gateway stores
  # `allowed_models` verbatim and matches it EXACTLY, so a list pasted as
  # `anthropic/claude-opus-5 , claude-opus-5 ` becomes two entries that can
  # never match anything. That is not hypothetical: it is how this canary was
  # first configured, and it answered 403 "Model 'claude-opus-5' is not
  # allowed for this virtual key" on every probe from 2026-08-21 to
  # 2026-08-25 while rendering as correct in the UI and in every JSON listing.
  # `squelch-control llm sync --check` flags untrimmed entries on every key,
  # including this one, which is the cheapest way to catch it.
  #
  # BLACKBOX_CANARY_MODEL MUST MATCH WHAT THE WARDEN HANDS TENANTS
  # (SQUELCH_WARDEN_LLM_STAGE1_MODEL / _STAGE2_MODEL, deploy/hosted/
  # 15-warden-config.yaml). If the canary probes a model string the fleet does
  # not send, green stops meaning "the fleet works" — which is the one way this
  # probe can lie. Default is the provider-qualified id, because this gateway
  # cannot auto-resolve a bare `claude-opus-5` (400 "could not auto resolve a
  # provider"); moving the fleet back to a bare id means moving this too.
  bifrost_llm:
    prober: http
    timeout: 60s
    http:
      preferred_ip_protocol: ip4
      fail_if_not_ssl: true
      method: POST
      headers:
        Content-Type: application/json
        anthropic-version: "2023-06-01"
        # BOTH, exactly as the daemon sends them to a gateway. `x-api-key` is
        # Anthropic's credential header and this gateway does not read it at
        # all — with only that set it answers 401 "virtual key is required",
        # meaning it saw no credential whatsoever. `x-bf-vk` is the one it
        # actually reads. The pair is what the daemon puts on a gateway
        # request, so it is what the canary must put on one.
        x-api-key: __BIFROST_CANARY_KEY__
        x-bf-vk: __BIFROST_CANARY_KEY__
      body: '{"model":"__CANARY_MODEL__","max_tokens":2000,"system":[{"type":"text","text":"You are a production canary. Answer only with the JSON object the schema requires.","cache_control":{"type":"ephemeral"}}],"messages":[{"role":"user","content":"Set ok to true."}],"output_config":{"format":{"type":"json_schema","schema":{"type":"object","additionalProperties":false,"required":["ok"],"properties":{"ok":{"type":"boolean"}}}},"effort":"low"}}'
      fail_if_body_not_matches_regexp:
        # A real Messages response, not an HTML error page or proxy interstitial.
        - '"type"\s*:\s*"message"'
        # The structured-output schema survived the gateway and was honored:
        # the verdict text carries the escaped `"ok"` field the schema requires.
        # This is the assertion the thin first cut was missing.
        - '\\"ok\\"'
      fail_if_body_matches_regexp:
        # Truncated before the verdict: the max_tokens lesson above, regressed.
        # Distinct from a schema miss so the dashboard failure is readable.
        - '"stop_reason"\s*:\s*"max_tokens"'
