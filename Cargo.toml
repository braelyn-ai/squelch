[workspace]
resolver = "3"
members = ["squelch-core", "squelch-httpauth", "squelch-ratelimit", "squelch-mcp", "squelch-tui", "squelch-api", "squelch-relay", "squelch-broker", "squelch-control", "squelch-warden", "squelchd"]

[workspace.package]
version = "0.0.3"
edition = "2024"
license = "MIT"

# Release builds target the headless Linux (Hetzner) box: thin LTO trims size
# and speeds hot paths without the full-LTO link-time blowup, and stripping
# symbols shrinks the shipped binary. Dev/test builds are unaffected.
[profile.release]
lto = "thin"
strip = "symbols"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
regex = "1"
async-trait = "0.1"
oauth2 = { version = "5", features = ["reqwest", "reqwest-blocking", "rustls-tls"], default-features = false }
keyring = "4"
# age (the rage crate) for encryption-at-rest of the file credential backend on
# HOSTED boxes: the control plane seals a tenant's token blob to this box's
# recipient before it ever touches a disk we operate, and only the daemon — handed
# the identity file by systemd — can open it. Self-host never sets the env var and
# never encrypts. default-features is off deliberately: the defaults are empty, and
# of the opt-ins we want only `armor`, because the ciphertext travels to the box as
# text inside a JSON body. No `cli-common` (pinentry/rpassword), no `ssh`, no
# `plugin` — none of that surface belongs in a daemon.
age = { version = "0.12", default-features = false, features = ["armor"] }
# `env` so `squelchd auth --broker` can be set once in a container's environment
# (SQUELCH_BROKER_URL) instead of on every invocation.
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
tiny_http = "0.12"
webbrowser = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# full_encoding is LOAD-BEARING: mail-parser's default feature set has no
# GBK/GB2312/Big5/Shift-JIS/EUC decoders, so without it every CJK-charset
# header and body ingests as U+FFFD replacement characters ("??" senders).
mail-parser = { version = "0.11", features = ["full_encoding"] }
futures = "0.3"
base64 = "0.22"
# Local on-box semantic recall (v1). fastembed runs ONNX embeddings on CPU with
# no network at inference time (weights download once to a cache under the data
# dir); sqlite-vec statically links the vec0 virtual-table extension; zerocopy
# passes Vec<f32> to sqlite as raw bytes without copying.
# Force the whole fastembed download path onto rustls: the default features pull
# native-tls for BOTH the model downloader (hf-hub) and the ONNX-runtime binary
# downloader (ort), which drags in openssl-sys — fine on macOS (Secure Transport),
# but a hard build failure on the headless Linux box (no libssl-dev). rustls keeps
# the tree pure-Rust everywhere. `image-models` is dropped: we only do text embeddings.
fastembed = { version = "5", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
sqlite-vec = "0.1.9"
zerocopy = "0.7"
# Kubernetes client for squelch-warden, which is a thin provisioner over a
# single-node k3s: kube-rs drives the API, k8s-openapi supplies the TYPED
# objects. Typed objects are the whole point — the warden never templates YAML,
# so a tenant label can only ever appear as a validated value inside a struct
# field. default-features off to keep openssl out of the tree (`rustls-tls` +
# `ring`, matching the rest of the workspace); `ws` is not optional despite the
# weight, because `squelchd pair` runs through pods/exec, which is a WebSocket.
# `runtime` is deliberately ABSENT: the warden runs no controller and watches
# nothing. Its one wait (a pod reporting Ready during a signup) is a bounded
# poll, which has no stream to reconnect and no bookmark to lose.
kube = { version = "4", default-features = false, features = ["client", "rustls-tls", "ring", "ws"] }
# One version feature, and it pins the API surface we compile against, not the
# cluster we talk to: v1_33 is a floor that k3s 1.33+ answers happily.
k8s-openapi = { version = "0.28", features = ["v1_33"] }
