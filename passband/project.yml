name: Passband
options:
  bundleIdPrefix: app.passband
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    # Release signs with the Developer ID under the hardened runtime, matching
    # what build.sh does when HARDENED=1. Debug stays ad-hoc and unhardened so
    # a debugger can still attach. build.sh takes SIGN_ID to override.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_IDENTITY[config=Release]: "Developer ID Application"
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_HARDENED_RUNTIME[config=Release]: YES
    DEAD_CODE_STRIPPING: YES
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GCC_OPTIMIZATION_LEVEL: 0

targets:
  Passband:
    type: application
    platform: macOS
    sources:
      - path: Sources/Passband
        excludes:
          - "Resources/**"
      - path: Sources/Passband/Resources
        type: folder
        buildPhase: resources
      # Icon Composer document; Xcode 26 hands it to actool, which emits the
      # Assets.car + fallback icns pair that build.sh produces by hand.
      - path: Passband.icon
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.passband.client
        PRODUCT_NAME: Passband
        # The plist is HAND-MAINTAINED and is the single source of truth for
        # bundle keys — build.sh substitutes the same file, so an `info:` block
        # here would fork the two builds and drop every key it did not restate.
        # That includes CFBundleURLTypes (the passband:// scheme): add bundle
        # keys to Info.plist, not here.
        INFOPLIST_FILE: Sources/Passband/Info.plist
        # Mirror of ./VERSION, which build.sh reads as the source of truth.
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: Passband
        CODE_SIGN_ENTITLEMENTS: Sources/Passband/Passband.entitlements
    dependencies:
      - sdk: WebKit.framework
      - sdk: Security.framework
      - sdk: UserNotifications.framework
      # Vendored prebuilt Sparkle — run vendor/fetch-sparkle.sh once before
      # `xcodegen generate` on a fresh clone. Xcode re-signs on embed.
      - framework: vendor/Sparkle/Sparkle.framework
        embed: true

schemes:
  Passband:
    build:
      targets:
        Passband: all
    run:
      config: Debug
    archive:
      config: Release
