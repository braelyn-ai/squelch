name: Passband
options:
  bundleIdPrefix: app.passband
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    # Release signs with the Developer ID under the hardened runtime, matching
    # what build.sh does when HARDENED=1. Debug stays ad-hoc and unhardened so
    # a debugger can still attach. build.sh takes SIGN_ID to override.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_IDENTITY[config=Release]: "Developer ID Application"
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_HARDENED_RUNTIME[config=Release]: YES
    DEAD_CODE_STRIPPING: YES
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GCC_OPTIMIZATION_LEVEL: 0

targets:
  Passband:
    type: application
    platform: macOS
    sources:
      - path: Sources/Passband
        excludes:
          - "Resources/**"
      - path: Sources/Passband/Resources
        type: folder
        buildPhase: resources
      # Icon Composer document; Xcode 26 hands it to actool, which emits the
      # Assets.car + fallback icns pair that build.sh produces by hand.
      - path: Passband.icon
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.passband.client
        PRODUCT_NAME: Passband
        # The plist is HAND-MAINTAINED and is the single source of truth for
        # bundle keys — build.sh substitutes the same file, so an `info:` block
        # here would fork the two builds and drop every key it did not restate.
        # That includes CFBundleURLTypes (the passband:// scheme): add bundle
        # keys to Info.plist, not here.
        INFOPLIST_FILE: Sources/Passband/Info.plist
        # Mirror of ./VERSION, which build.sh reads as the source of truth.
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: Passband
        CODE_SIGN_ENTITLEMENTS: Sources/Passband/Passband.entitlements
    dependencies:
      - sdk: WebKit.framework
      - sdk: Security.framework
      - sdk: UserNotifications.framework
      # Vendored prebuilt Sparkle — run vendor/fetch-sparkle.sh once before
      # `xcodegen generate` on a fresh clone. Xcode re-signs on embed.
      - framework: vendor/Sparkle/Sparkle.framework
        embed: true

  # The phone client. SAME Sources/Passband — the store, the wire types, the
  # design tokens and the pairing flow are one codebase, and the only thing
  # Sources/PassbandiOS adds is the shell shape (a tab bar instead of a window
  # with a rail). Everything that cannot cross yet is named in `excludes` below,
  # each with the phase that brings it over.
  PassbandiOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/Passband
        excludes:
          - "Resources/**"
          # The Mac bundle's own plist and entitlements. XcodeGen only spares
          # THIS target's INFOPLIST_FILE from the resources phase, so left in
          # they would be copied over the iOS plist inside the same bundle.
          - "Info.plist"
          - "Passband.entitlements"
          # The macOS app shell: NSApplicationDelegate, the window, the menu
          # commands. PassbandiOSApp is its twin. RoutedHeader/RoutedHost live
          # in RootView.swift, which is why the three routed views below cannot
          # come over yet.
          - "App/**"
          # Sparkle. iOS has no sideloaded updater; the App Store is the updater.
          - "Model/Updater.swift"
          # --- phase 2: the reader ---------------------------------------
          # WKWebView hosted through an NSViewRepresentable, plus the whole
          # body-preparation pipeline nested inside it (EmailWebView.Prepared).
          - "Views/EmailWebView.swift"
          # Needs EmailWebView.
          - "Views/ThreadViewer.swift"
          - "Views/RevealPanel.swift"
          # NSSavePanel (Downloads.saveBytes is macOS-fenced) + a PDFView
          # NSViewRepresentable. iOS saves through a document picker instead.
          - "Views/AttachmentStrip.swift"
          # --- phase 3: composing + the assistant -------------------------
          # NSTextView representable — the markdown editor the composers use.
          - "Views/MarkdownTextView.swift"
          # Needs MarkdownTextView.
          - "Views/ComposePane.swift"
          # Needs MarkdownTextView, ThreadViewer and ComposePane's summary rows.
          - "Views/InlineReply.swift"
          # Needs ComposePane's ComposeSummaryRow.
          - "Views/AskBar.swift"
          # Needs AskBar. Otherwise portable — the toasts, the palettes and the
          # tour overlay it hosts all compile here already.
          - "Views/ActionLayer.swift"
          # --- phase 4: the remaining destinations ------------------------
          # The rail is the Mac's navigation model; the phone's is the tab bar.
          - "Views/SidebarRail.swift"
          # All three render inside RoutedHeader, which lives in the excluded
          # App/RootView.swift. Nothing else about them is macOS-only.
          - "Views/AuthView.swift"
          - "Views/UsageView.swift"
          - "Views/SettingsView.swift"
      - path: Sources/PassbandiOS
      # The same fonts and chimes the Mac ships, but NOT as one `Resources`
      # folder reference the way the macOS target takes them. An iOS bundle is
      # FLAT — its root IS the resources directory — and a folder literally
      # named `Resources` at that root makes CFBundle read the bundle in the
      # macOS layout and look for Info.plist inside it. installd then rejects
      # the app with the memorable non-sequitur "Missing bundle ID".
      #
      # So: the chimes keep a `Sounds/` subdirectory, because Notifier looks
      # them up by exactly that name, and the two font files sit at the root
      # where Info.plist's UIAppFonts (and Typo's Bundle lookup) name them.
      - path: Sources/Passband/Resources/Sounds
        type: folder
        buildPhase: resources
      - path: Sources/Passband/Resources/newsreader-var.ttf
        buildPhase: resources
      - path: Sources/Passband/Resources/newsreader-italic-var.ttf
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.passband.client.ios
        # NO PRODUCT_NAME override, so the bundle is PassbandiOS.app: XcodeGen
        # derives a scheme's BuildableName from the TARGET name, and a product
        # named otherwise leaves the scheme pointing at a file that never
        # exists. The app still reads "Passband" everywhere a human sees it —
        # CFBundleDisplayName and CFBundleName both say so in Info.plist.
        #
        # Hand-maintained, exactly as the Mac's is — see the note on the macOS
        # target above. CFBundleURLTypes (passband://) lives there, not here.
        INFOPLIST_FILE: Sources/PassbandiOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/PassbandiOS/PassbandiOS.entitlements
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # iPhone only. The iPad layout is a different design, not a stretch.
        TARGETED_DEVICE_FAMILY: "1"
        # Overrides of macOS-shaped base settings. "Developer ID Application"
        # does not exist on iOS and the hardened runtime is a macOS concept, so
        # both are restated here for Release too; simulator builds sign ad-hoc.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_IDENTITY[config=Release]: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_HARDENED_RUNTIME[config=Release]: NO
    dependencies:
      - sdk: WebKit.framework
      - sdk: Security.framework
      - sdk: UserNotifications.framework
      # NO Sparkle: see the Updater.swift exclusion above.

schemes:
  Passband:
    build:
      targets:
        Passband: all
    run:
      config: Debug
    archive:
      config: Release

  PassbandiOS:
    build:
      targets:
        PassbandiOS: all
    run:
      config: Debug
    archive:
      config: Release
